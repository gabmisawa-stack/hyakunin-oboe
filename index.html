<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141824">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ふだっち">
<title>ふだっち</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">

<!-- ============ さいしょの画面（名前をきく） ============ -->
<section id="welcome" class="screen">
  <div class="wbox">
    <div class="brand">
      <span class="seal">歌</span>
      <h1>ふだっち</h1>
    </div>
    <p class="wsub">百人一首の 決まり字を おぼえる れんしゅう</p>
    <label class="wlabel" for="whoName">なまえを おしえてね</label>
    <input id="whoName" type="text" maxlength="12" autocomplete="off"
           enterkeyhint="go" placeholder="れい：ちはや">
    <p class="wnote">きろくは この iPad の なかだけに のこります。<br>
      あとから せっていで、ほかの ひとを ふやせます。<br>
      よみあげは、はじめは れんしゅう用の こえです。<br>
      ほんものの 読み方の 音源も、あとから 入れられます。</p>
    <button id="whoGo" class="start" disabled>はじめる</button>
  </div>
</section>

<!-- ============ ホーム ============ -->
<section id="home" class="screen">
  <header class="apphead hero">
    <div class="brand">
      <span class="seal">歌</span>
      <h1>ふだっち</h1>
      <span class="sub">百人一首　おぼえかるた</span>
    </div>
    <div class="headbtns">
      <button class="ghost user" id="userBtn">なつ ▾</button>
      <button class="ghost" data-go="stats">せいせき</button>
      <button class="ghost" data-go="settings">せってい</button>
    </div>
  </header>

  <div id="audioNotice" class="notice">
    <span class="nt"></span>
    <button class="ghost" data-go="settings">せっていを ひらく</button>
    <button class="x" id="noticeX" aria-label="とじる">×</button>
  </div>

  <div class="pick">
    <h2>いろを えらぶ　<span id="pickNote" class="picknote"></span></h2>
    <div id="colorPicks" class="colorpicks"></div>
  </div>

  <div class="pick">
    <h2>れんしゅうの しかた</h2>
    <div id="modePicks" class="modepicks"></div>
  </div>

  <button id="startBtn" class="start" disabled>はじめる</button>
</section>

<!-- ============ セッション ============ -->
<section id="session" class="screen">
  <header class="sesshead">
    <button class="ghost" id="quitBtn">やめる</button>
    <div class="progressbar"><div id="progFill"></div></div>
    <div id="counter" class="counter">1 / 20</div>
  </header>

  <div id="stage" class="stage"></div>
  <div id="board" class="board"></div>
  <div id="feedback" class="feedback"></div>
</section>

<!-- ============ 結果 ============ -->
<section id="result" class="screen">
  <h2 id="resultTitle">おつかれさま！</h2>
  <div id="resultStats" class="resultstats"></div>
  <div id="resultWeak" class="weaklist"></div>
  <div class="row">
    <button class="start" data-go="home">ホームへ</button>
    <button class="ghost big" id="againBtn">もういちど</button>
  </div>
</section>

<!-- ============ せいせき ============ -->
<section id="stats" class="screen">
  <header class="apphead"><h2>せいせき</h2><button class="ghost" data-go="home">もどる</button></header>
  <div id="statsBody" class="statsbody"></div>
</section>

<!-- ============ せってい ============ -->
<section id="settings" class="screen">
  <header class="apphead"><h2>せってい</h2><button class="ghost" data-go="home">もどる</button></header>
  <div id="settingsBody" class="settingsbody"></div>
</section>

<!-- どの画面にも出しておくミュートボタン -->
<button id="muteBtn" class="mutebtn" aria-label="音を けす／だす">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
    <path class="spk" d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
    <g class="wave" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>
    </g>
    <path class="slash" d="M4 20L20 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
</button>

<script type="module" src="app.js"></script>
